
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Bookmark's Favicon Changer</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">

    <link rel="stylesheet" href="js/lib/jstree/themes/default/style.min.css">

</head>
<body>
    <h3 data-loc="application_title"></h3>
    <div id="app" class="container">

        <div class="row">
            <div class="bookmark_box" id="jstree"></div>

            <form id="changeFaviconSection" class="p-3 w-100" style="display: none;">
                <div class="form-row">
                    <div class="col">
                        <span data-loc="current"></span> <img id="bookmarkFavicon">
                    </div>
                    <input type="hidden" id="url" />
                    <ul>
                        <li class="list-group-item">
                            <button data-loc="confirm" type="button" id="change" class="btn btn-secondary"></button>
                        </li>
                    </ul>
                </div>
                <textarea hidden id="file_output"></textarea>
            </form>
        </div>
    </div>

    <script src="js/lib/jquery-3.1.1.js"></script>
    <script src="js/lib/jstree/jstree.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/options.js"></script>

</body>
</html>
